name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned per the supply-chain rule: the lockfile — and this file — are the
      # dependency security review surface.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      # The only online step: warm every cache the gate needs — the workspace env
      # (ruff/mypy/pytest and Python itself) and a wheel build of packages/vsor (the
      # acceptance builds the current tree's wheel and runs vsor from it, so hatchling
      # must be cached). The gate then runs with UV_OFFLINE=1 because the init spec
      # requires its acceptance to run with networking disabled: init must perform no
      # network I/O, and an offline uv turns any attempted download into a hard
      # failure instead of a silent pass. Known gap, recorded 2026-08-13: UV_OFFLINE
      # blocks package fetches only — it does not sandbox git or raw sockets; the
      # no-network negative contract is additionally held by review (scaffold.py
      # spawns git subcommands only and imports no networking module). Full socket
      # isolation (e.g. an unshare -n tier) is a later harness upgrade.
      - name: warm uv caches
        run: |
          uv sync --package vsor
          uv build --package vsor --wheel -o "$(mktemp -d)"
          uvx --from packages/vsor vsor --version || true
      - run: make gate
        env:
          UV_OFFLINE: "1"

  # Browser tier of specs/sor-site/surface (B5–B13, B15, B16; B14 retired
  # 2026-08-14) plus the build/dev acceptance of specs/vsor/build: the only node
  # job — the python gate above stays node-free.
  # `make surface` first runs `make build-acceptance` (tests/acceptance/build.sh:
  # stages the site runtime via `make wheel`, builds the vsor wheel, drives
  # `vsor build`/`vsor dev` for real), then assembles the fixture site twice
  # (normally and with B12's sentinels — there is no stock/themed axis: the
  # design system is inside the shell and a project cannot opt out), builds both
  # with Docusaurus, serves them statically and runs the Playwright acceptance.
  surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/sor-site/package-lock.json
      # uv drives the build acceptance (wheel build + uvx vsor); this job runs
      # online — the acceptance itself disables networking for exactly the rows
      # that claim reuse (offline second build).
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: npm ci
        working-directory: packages/sor-site
      # Chromium version comes from the @playwright/test pin in the lockfile.
      - run: npx playwright install --with-deps chromium
        working-directory: packages/sor-site
      - run: make surface

  # The HOSTING tier (tests/acceptance/deploy.sh): the two shapes a static host
  # has — the build AS the document root, and the build under a `/<name>/`
  # subpath — through the real wheel and a real browser.
  #
  # Its own job rather than a step in `surface`, for the reason the Makefile
  # gives: it stages the same shared paths (`make wheel` and packages/sor-site's
  # node_modules), so the two cannot run on one checkout at the same time.
  #
  # It exists as a job because it is the only tier that reads `vsor build`'s own
  # output rather than an assembled fixture, and the only one that ever serves at
  # a prefix. Both of those gaps hid real, user-visible defects: an unclickable
  # first sidebar link in every build, a favicon 404 on every page of a subpath
  # deploy, and a sitemap whose route set changed with the deploy shape. Nothing
  # else in this file could see any of them.
  hosting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/sor-site/package-lock.json
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: npm ci
        working-directory: packages/sor-site
      - run: npx playwright install --with-deps chromium
        working-directory: packages/sor-site
      - run: make deploy-acceptance
