# Framework dev/CI machinery ONLY — never a user requirement.
# Users put any Postgres DSN in .env (Neon free tier recommended); AGENTS.md decision 10.
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: vsor
      POSTGRES_PASSWORD: vsor
      POSTGRES_DB: vsor
    ports:
      - "5432:5432"
