[project]
name = "vsor"
version = "0.1.1"
description = "Compile a folder of governed markdown into a website and an MCP server, with cited answers and honest abstention."
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
# A byte-identical copy of the repo-root LICENSE. PEP 639 globs cannot escape the
# project root, so the file has to live here.
# found live 2026-08-14: a SYMLINK to ../../LICENSE looks like the "one fact, one file"
# answer and builds a wheel fine — `uv build --wheel` reads the source tree directly.
# It then fails the sdist→wheel path that `make wheel` actually runs (`uv build`, no
# --wheel): the symlink is packed into the sdist still pointing outside it, and
# unpacking dies with "symlink destination for ../../LICENSE is outside of the target
# directory". A `pip install --no-binary vsor` would hit the same wall. So: a copy, and
# the drift risk is nil — the Apache-2.0 text is immutable boilerplate.
# NOTICE rides with LICENSE for the same reason and by the same copy rule: it is the
# attribution for the forked upstream app, the shadcn/ui components and the two vendored
# OFL typefaces, and a wheel is the only artifact a lawyer reading PyPI can open.
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Panaversity" }]
keywords = ["mcp", "docusaurus", "knowledge-base", "citations", "abstention", "markdown", "static-site"]
# No `License ::` trove classifier: PyPI rejects a distribution that carries both a
# license expression (above) and a license classifier — they are mutually exclusive
# since PEP 639. The expression is the one that ships.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Legal Industry",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Typing :: Typed",
]
# Exactly two runtime deps (specs/vsor/build): pyyaml parses the instance.md frontmatter
# block (safe_load of the block only), packaging evaluates vsor.requires SpecifierSets.
dependencies = [
    "packaging>=24.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/panaversity/zia-vertical-system-of-record"
Repository = "https://github.com/panaversity/zia-vertical-system-of-record"
Changelog = "https://github.com/panaversity/zia-vertical-system-of-record/blob/main/CHANGELOG.md"
Issues = "https://github.com/panaversity/zia-vertical-system-of-record/issues"

[project.scripts]
vsor = "vsor.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    # test-only: validates the golden build.lock.json record against the committed schema
    "jsonschema",
    "types-jsonschema",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The wheel transport (specs/vsor/build): `make wheel` stages the shell into
# src/vsor/_site_runtime/ (gitignored — generated, never committed) before `uv build`;
# hatchling's `artifacts` includes VCS-ignored files. The tarballs are a glob rather
# than a list of names on purpose: the shell's package.json is the one place that says
# which packages exist, and the wheel-content test enumerates the expectation FROM that
# file — so a partial staging still cannot ship silently, while adding a library needs
# no edit here. That test also asserts the app tarball carries the config, the MDX
# vocabulary and the token stylesheet — the gate on the make-wheel-before-uv-build
# ordering.
[tool.hatch.build]
artifacts = [
    "/src/vsor/_site_runtime/*.tgz",
    "/src/vsor/_site_runtime/package.json",
    "/src/vsor/_site_runtime/package-lock.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
