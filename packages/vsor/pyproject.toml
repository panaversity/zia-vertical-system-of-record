[project]
name = "vsor"
version = "0.1.0"
description = "Compile a folder of governed markdown into a website and an MCP server, with cited answers and honest abstention."
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
# Exactly two runtime deps (specs/vsor/build): pyyaml parses the instance.md frontmatter
# block (safe_load of the block only), packaging evaluates vsor.requires SpecifierSets.
dependencies = [
    "packaging>=24.0",
    "pyyaml>=6.0",
]

[project.scripts]
vsor = "vsor.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    # test-only: validates the golden build.lock.json record against the committed schema
    "jsonschema",
    "types-jsonschema",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The wheel transport (specs/vsor/build): `make wheel` stages the shell into
# src/vsor/_site_runtime/ (gitignored — generated, never committed) before `uv build`;
# hatchling's `artifacts` includes VCS-ignored files. The tarballs are a glob rather
# than a list of names on purpose: the shell's package.json is the one place that says
# which packages exist, and the wheel-content test enumerates the expectation FROM that
# file — so a partial staging still cannot ship silently, while adding a library needs
# no edit here. That test also asserts the app tarball carries the config, the MDX
# vocabulary and the token stylesheet — the gate on the make-wheel-before-uv-build
# ordering.
[tool.hatch.build]
artifacts = [
    "/src/vsor/_site_runtime/*.tgz",
    "/src/vsor/_site_runtime/package.json",
    "/src/vsor/_site_runtime/package-lock.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
