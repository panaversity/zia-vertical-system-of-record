[project]
name = "vsor"
version = "0.0.0"
description = "Compile a folder of governed markdown into a website and an MCP server, with cited answers and honest abstention."
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
dependencies = []

[project.scripts]
vsor = "vsor.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
